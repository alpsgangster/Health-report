[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-report"
version = "0.1.0"
description = "Turn Apple Health exports and InBody reports into a reviewable health report. Local-first: your data never leaves your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "health-report contributors" }]
keywords = ["apple-health", "inbody", "health-data", "self-tracking", "local-first", "byo-key"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# 核心零依赖：只要标准库就能跑，克隆下来立刻可用。
dependencies = []

[project.optional-dependencies]
# lxml 能把几 GB 的 export.xml 解析快好几倍；装不装都能跑。
fast = ["lxml>=4.9"]
dev = ["pytest>=7", "lxml>=4.9"]

[project.scripts]
health-report = "health_report.cli:main"

[project.urls]
Homepage = "https://github.com/alpsgangster/Health-report"
Issues = "https://github.com/alpsgangster/Health-report/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
